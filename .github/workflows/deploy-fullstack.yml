name: Deploy web-fullstack

# Paused: no AWS infra provisioned yet for web-fullstack (no S3 bucket, CloudFront
# distribution, or deploy role — mj-cloud-terraform/sites.tf has module.site_fullstack
# defined but never applied), and no GitHub secrets set for it. Re-enable the `push`
# trigger once that's provisioned (or switch to a GitHub Pages-based deploy like
# deploy-backend-pages.yml, matching web-backend).
on:
  workflow_dispatch:

concurrency:
  group: deploy-fullstack
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-static-site.yml
    with:
      build_command: pnpm run build:fullstack
      dist_path: apps/web-fullstack/dist
      aws_region: ${{ vars.AWS_REGION }}
    secrets:
      aws_role_arn: ${{ secrets.AWS_ROLE_ARN_FULLSTACK }}
      s3_bucket: ${{ secrets.S3_BUCKET_FULLSTACK }}
      cloudfront_distribution_id: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID_FULLSTACK }}
